name: Build Windows x86

on:
  push:
  pull_request:

jobs:
  build-windows-x86:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        
    - name: Publish App (Windows x86)
      run: dotnet publish EtherTransfer.UI/EtherTransfer.UI.csproj -c Release -r win-x86 --self-contained true -p:PortableBuild=false -o ./publish
      
    - name: Install Inno Setup
      run: |
        choco install innosetup
        echo "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH
      
    - name: Build Installer (x86)
      run: ISCC.exe EtherTransfer_x86.iss
      
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: EtherTransfer-Windows-Installer-x86
        path: publish/installer/EtherTransfer_Setup_x86.exe
