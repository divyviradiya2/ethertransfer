name: Build Windows x64

on:
  push:
  pull_request:

jobs:
  build-windows-x64:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        
    - name: Publish App (Windows x64)
      run: dotnet publish EtherTransfer.UI/EtherTransfer.UI.csproj -c Release -r win-x64 --self-contained true -o ./publish
      
    - name: Compile Inno Setup Script
      uses: minicrm/setup-inno-setup@v1
      
    - name: Build Installer
      run: ISCC.exe EtherTransfer.iss
      
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: EtherTransfer-Windows-Installer-x64
        path: publish/installer/EtherTransfer_Setup_x64.exe
