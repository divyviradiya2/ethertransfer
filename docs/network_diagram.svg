<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360">
  <!-- Container Box -->
  <rect x="1" y="1" width="898" height="358" rx="10" fill="#18181B" stroke="#27272A" stroke-width="1.5"/>

  <!-- ================= LEFT: SENDER PC ================= -->
  <g transform="translate(40, 52)">
    <!-- Monitor Outer Frame -->
    <rect x="0" y="0" width="290" height="185" rx="6" fill="#18181B" stroke="#3F3F46" stroke-width="1.5"/>
    <!-- Monitor Display Screen -->
    <rect x="5" y="5" width="280" height="175" rx="3" fill="#141416"/>

    <!-- Top Window Bar -->
    <rect x="5" y="5" width="280" height="22" rx="3" fill="#202023"/>
    <line x1="5" y1="27" x2="285" y2="27" stroke="#27272A" stroke-width="1"/>
    <rect x="14" y="13" width="46" height="6" rx="2" fill="#52525B"/>

    <!-- Left Column (Discovered Devices) -->
    <rect x="12" y="38" width="72" height="30" rx="3" fill="#1E1E22" stroke="#2E2E33" stroke-width="0.8"/>
    <circle cx="22" cy="53" r="3" fill="#52525B"/>
    <rect x="30" y="48" width="42" height="5" rx="2" fill="#52525B"/>
    <rect x="30" y="56" width="26" height="3.5" rx="1.5" fill="#3F3F46"/>

    <rect x="12" y="76" width="72" height="30" rx="3" fill="#1E1E22" stroke="#2E2E33" stroke-width="0.8"/>
    <circle cx="22" cy="91" r="3" fill="#3F3F46"/>
    <rect x="30" y="86" width="36" height="5" rx="2" fill="#3F3F46"/>
    <rect x="30" y="94" width="22" height="3.5" rx="1.5" fill="#2E2E33"/>

    <!-- Column Divider -->
    <line x1="95" y1="27" x2="95" y2="180" stroke="#27272A" stroke-width="1"/>

    <!-- Right Column (Files to Transfer) -->
    <rect x="192" y="34" width="38" height="10" rx="2" fill="#202023" stroke="#2E2E33" stroke-width="0.6"/>
    <rect x="236" y="34" width="36" height="10" rx="2" fill="#202023" stroke="#2E2E33" stroke-width="0.6"/>

    <!-- List Box Container -->
    <rect x="105" y="49" width="168" height="92" rx="4" fill="#1A1A1D" stroke="#2E2E33" stroke-width="0.8"/>
    
    <!-- Item 1 -->
    <rect x="111" y="56" width="156" height="20" rx="2" fill="#202023"/>
    <rect x="117" y="63" width="8" height="6" rx="1" fill="#3F3F46"/>
    <rect x="130" y="64" width="60" height="4.5" rx="2" fill="#52525B"/>
    <rect x="244" y="64" width="16" height="4.5" rx="2" fill="#3F3F46"/>

    <!-- Item 2 -->
    <rect x="111" y="82" width="156" height="20" rx="2" fill="#202023"/>
    <rect x="117" y="89" width="8" height="6" rx="1" fill="#3F3F46"/>
    <rect x="130" y="90" width="50" height="4.5" rx="2" fill="#52525B"/>
    <rect x="244" y="90" width="16" height="4.5" rx="2" fill="#3F3F46"/>

    <!-- Item 3 -->
    <rect x="111" y="108" width="156" height="20" rx="2" fill="#202023"/>
    <rect x="117" y="115" width="8" height="6" rx="1" fill="#3F3F46"/>
    <rect x="130" y="116" width="55" height="4.5" rx="2" fill="#52525B"/>
    <rect x="244" y="116" width="16" height="4.5" rx="2" fill="#3F3F46"/>

    <!-- Send Button -->
    <rect x="195" y="151" width="78" height="17" rx="3" fill="#2E2E33" stroke="#3F3F46" stroke-width="0.8"/>
    <rect x="213" y="157" width="42" height="4.5" rx="2" fill="#71717A"/>

    <!-- Monitor Stand -->
    <rect x="0" y="177" width="290" height="8" fill="#202023"/>
    <rect x="135" y="185" width="20" height="18" fill="#27272A"/>
    <rect x="108" y="203" width="74" height="6" rx="3" fill="#27272A" stroke="#3F3F46" stroke-width="0.8"/>

    <!-- Sender PC Label -->
    <text x="145" y="235" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#F4F4F5">Sender PC</text>
  </g>

  <!-- ================= CENTER: DIRECT CABLE & SLASH-SEPARATED SPEEDS ================= -->
  <g transform="translate(330, 52)">
    <!-- Top Header -->
    <text x="120" y="52" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#A1A1AA" letter-spacing="1.5">DIRECT ETHERNET CABLE</text>
    
    <!-- Cable Spine Track -->
    <line x1="0" y1="94" x2="240" y2="94" stroke="#27272A" stroke-width="6" stroke-linecap="round"/>
    <line x1="0" y1="94" x2="240" y2="94" stroke="#3F3F46" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Left RJ45 Boot -->
    <rect x="0" y="88" width="8" height="12" rx="2" fill="#3F3F46"/>
    <!-- Right RJ45 Boot -->
    <rect x="232" y="88" width="8" height="12" rx="2" fill="#3F3F46"/>

    <!-- Moving Data Packet / Folder -->
    <g transform="translate(106, 81)">
      <path d="M 3 2 L 10 2 L 13 5 L 24 5 Q 26 5 26 7 L 26 21 Q 26 23 24 23 L 3 23 Q 0 23 0 21 L 0 4 Q 0 2 3 2 Z" fill="#0284C7"/>
      <path d="M 0 9 L 26 9 L 24 21 Q 24 23 22 23 L 4 23 Q 2 23 2 21 Z" fill="#38BDF8"/>
    </g>

    <!-- Clean Slash-Separated Speed Tiers -->
    <text x="120" y="134" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" fill="#34D399">1 Gbps / 2.5 Gbps / 10 Gbps</text>
    <text x="120" y="152" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#71717A">Up to Full Wire-Speed</text>
  </g>

  <!-- ================= RIGHT: RECEIVER PC ================= -->
  <g transform="translate(570, 52)">
    <!-- Monitor Outer Frame -->
    <rect x="0" y="0" width="290" height="185" rx="6" fill="#18181B" stroke="#3F3F46" stroke-width="1.5"/>
    <!-- Monitor Display Screen -->
    <rect x="5" y="5" width="280" height="175" rx="3" fill="#141416"/>

    <!-- Top Window Bar -->
    <rect x="5" y="5" width="280" height="22" rx="3" fill="#202023"/>
    <line x1="5" y1="27" x2="285" y2="27" stroke="#27272A" stroke-width="1"/>
    <rect x="14" y="13" width="46" height="6" rx="2" fill="#52525B"/>

    <!-- Modal Dialog Wireframe -->
    <rect x="24" y="38" width="232" height="126" rx="5" fill="#1E1E22" stroke="#2E2E33" stroke-width="0.8"/>
    
    <!-- Modal Title -->
    <rect x="114" y="48" width="52" height="6" rx="2" fill="#52525B"/>

    <!-- File Item Box -->
    <rect x="36" y="62" width="208" height="24" rx="3" fill="#18181B" stroke="#27272A" stroke-width="0.8"/>
    <rect x="46" y="71" width="75" height="5" rx="2" fill="#52525B"/>
    <rect x="212" y="71" width="22" height="5" rx="2" fill="#3F3F46"/>

    <!-- Progress Bar (Muted Monochrome) -->
    <rect x="36" y="96" width="208" height="6" rx="3" fill="#27272A"/>
    <rect x="36" y="96" width="154" height="6" rx="3" fill="#52525B"/>

    <!-- Subtitle metrics -->
    <rect x="36" y="110" width="45" height="4" rx="2" fill="#3F3F46"/>
    <rect x="208" y="110" width="36" height="4" rx="2" fill="#3F3F46"/>

    <!-- Cancel Button -->
    <rect x="108" y="128" width="64" height="16" rx="3" fill="#18181B" stroke="#2E2E33" stroke-width="0.8"/>
    <rect x="124" y="134" width="32" height="4" rx="2" fill="#52525B"/>

    <!-- Monitor Stand -->
    <rect x="0" y="177" width="290" height="8" fill="#202023"/>
    <rect x="135" y="185" width="20" height="18" fill="#27272A"/>
    <rect x="108" y="203" width="74" height="6" rx="3" fill="#27272A" stroke="#3F3F46" stroke-width="0.8"/>

    <!-- Receiver PC Label -->
    <text x="145" y="235" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#F4F4F5">Receiver PC</text>
  </g>
</svg>
